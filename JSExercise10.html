<!DOCTYPE html>
<html>
    <head><title>Array Statment</title></head>
    <body>
        <h2>JavaScript Array</h2>
        <p id="demo"></p>


        <script>
            myarray=new Array();
            myarray[0]="First Element";
            myarray[1]="Second Element";
            myarray[2]="Third Element";

            for(i=0;i<3;i++){
                     document.write(myarray[i]+"<br>");           
            }
           
            var colors=["green","Yellow","red"];
            document.getElementById('demo').innerHTML=colors;
        </script>
    </body>
</html>
