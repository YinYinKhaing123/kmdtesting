<!DOCTYPE html>
<html>
    <head><title>Position</title></head>
    <style>
        div.relative{
            border:3px solid #73AD21;
            width:400px;
            height:200px;
            position: relative;
        }
        div.absolute{
            border:3px solid #73AD21;
            width:200px;
            height: 100px;
            top:80px;
            right:0;
            position:absolute;
        }
         div.static{
            border:3px solid #73AD21;
            width:200px;
            height: 100px;
            top:80px;
            right:0;
            position:static;
        }
        div.fixed{
            border:3px solid #73AD21;
            width:300px;
            height: 400px;
            top:80px;
            right:0;
            position:fixed;
        }
    </style>
    <body>
        <h2>HTML Position</h2>
        <div class="relative">This div element has position:relative</div>
        <div class="absolute">This div element has position:absolute</div>
        <div class="static">This div element has position:static</div>
         <div class="fixed">This div element has position:fixed</div>
    </body>
</html>
