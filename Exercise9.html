<!DOCTYPE html>
<html>
    <head>
        <title>Form Control</title>
        <link rel="stylesheet" href="form.css"/>
    </head>
    <body>
        <form action="http://www.w3schools.com" method="get">
            <fieldset style="width:300px;">
            <legend>Please Fill Registration</legend>
            <p>
                Name:
                <input type="text" name="username" id="username" size="30" placeholder="Enter User Name"/>
            </p>
            <p>
                Email:
                <input type="text" name="email" id="email" size="30" placeholder="Enter your Email"/>
            </p>
            <p>
                Password:
                <input type="password" name="password" id="password" size="30" placeholder="Enter your Password"/>
            </p>
            <p>
                Gender:
                <input type="radio" name="sex" id="male" value="Male"/>Male
                <input type="radio" name="sex" id="female" value="Female"/>Female
            </p>
            <p>
                Address:
                <textarea name="address" id="address"></textarea>
            </p>
            <p>
                Division:
                <select name="division" id="division">
                    <option value="default">Please Select a Division</option>
                    <option selected="">Yangon</option>
                    <option value="mdy">Mandalay</option>
                    <option value="Pago">Pago</option>
                </select>
            </p>
            <p>
                <input type="submit" name="submit" value="Submit" class="button" onclick="return validateForm()"/>
                <input type="reset" name="Clear" value="Clear" class="button"/>
            </p>
            </fieldset>
        </form>

        <script>
            function validateForm(){
                if(document.getElementById("username").value==""){
                    alert("Name must be filled out");
                    document.getElementById("username").focus();
                    return false;
                }
                else if(document.getElementById("email").value==""){
                    alert("Email must be filled out");
                    document.getElementById("email").focus();
                    return false;
                }
                else if(document.getElementById("password").value==""){
                    alert("password must be filled out");
                    document.getElementById("password").focus();
                    return false;
                }
                return true;
            }
        </script>


    </body>
</html>
