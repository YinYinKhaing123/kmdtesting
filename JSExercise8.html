<!DOCTYPE html>
<html>
<head><title>Current Date</title></head>
<body>
    TodayDate:
    <input type="text" name="date" id="date"/>
    <script>
        var today=new Date();
        var dd=today.getDate();
        var mm=today.getMonth()+1;
        var yyyy=today.getFullYear();
        if(dd<10){
            dd='0'+dd;
        }
        if(mm<10){
            mm='0'+mm;
        }
        today=dd+'/'+mm+'/'+yyyy;
        var text=document.getElementById('date');
        text.value=today;
    </script>
</body>
</html>
