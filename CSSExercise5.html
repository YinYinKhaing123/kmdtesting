<!DOCTYPE html>
<html>
    <head><title>Menu Bar</title></head>
    <style>
        ul{
            list-style:none;
            margin:0;
            padding:0;
        }
        li{
            background-color:#09c;
            border:1px solid white;
            width:150px;
            height:50px;
            line-height:50px;
            text-align: center;
            float: left;
            border-radius:8px;
        }
        li a{
            text-decoration: none;
            color:white;
            display: block;
        }
        li a:hover{
            border:1px solid #09c;
            background-color:#fff;
            border-radius:8px;
            color: #09C;
        }
        li a:active{
            background-color:#999;            
        }
    </style>
    <body>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Subject</a></li>
            <li><a href="#">Book</a></li>
            <li><a href="#">Contact Us</a></li>
            <li><a href="#">About Us</a></li>
        </ul>
    </body>
</html>
