<!DOCTYPE html>
<html>
    <head><title>Change HTML Content and Style</title></head>
    <body>
        <h1>What can JavaScript do?</h1>
        <p id="para1">
            JavaScript can change HTML Content
        </p>
        <p id="para2">
            JavaScript can change HTML Content Style
        </p>

        <script>
            document.getElementById('para1').innerHTML="KMD Computer Centre";
            document.getElementById('para2').style.color="red";
        </script>
    </body>
</html>
