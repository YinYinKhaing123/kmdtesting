<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <style>
        div{
            border:2px solid #933;
            width:200px;
            height:100px;
            margin:10px;
        }
        .box1{
            background:#F63;
            float:left;
        }
        .box2{
            background:#06F;
            float: right;
        }
        .box3{
            background:#360;
            clear:left;
        }
    </style>
    <body>
        <div class="box1">First Div</div>
        <div class="box2">Second Div</div>
        <div class="box3">Third Div</div>
    </body>
</html>
