<!DOCTYPE html>
<html>
    <head><title>Looping Structure</title></head>
    <body>
            <script>   // 6<=5  6
                for(i=1;i<=5;i++){
                    document.write("Hello "+i+"<br>");
                }
                i=2;
                while(i<=10){
                    document.write("Even Number is "+i+"<br>");
                    i+=2;
                }
            </script>
    </body>
</html>
