<!DOCTYPE html>
<html>
    <head><title>Website Learning With KMD</title>
        <link rel="stylesheet" href="Style2.css"/>
        <link rel="stylesheet" href="about.css"/>
        <link rel="stylesheet" href="buy.css"/>
    </head>
    <body>
        <section class="buysec">
            <nav class="navbar">
                <a href="#" class="logo">Doll Shopping</a> 
                <ul type="none" class="links">
                    <a href="index.html"><li class="link">Home</li></a>
                    <a href="product.html"><li class="link">Product</li></a>
                    <a href="about.html"><li class="link">About</li></a>
                    <a href="contact.html"><li class="link contact">Contact</li></a>
                </ul>
            </nav>
            <!-- container -->
             <div class="buy">
                <div class="buy-card">
                    <p class="title">Welcome Users</p>
                    <p class="text">
                        Thank you for ordering,please your name and address by filling these form 
                    </p>

                <!-- form -->
                 <form action="">
                    <div class="inputborder">
                        <div class="formdiv">
                            <input type="text" class="forminput" id="myname" placeholder="">
                            <label for="" class="formlabel">
                                Your Name
                            </label>
                        </div>
                    </div>
                    <!-- next inputbox -->
                     <div class="inputborder">
                        <div class="formdiv">
                            <input type="text" class="forminput" id="add" placeholder="">
                            <label for="" class="formlabel">
                               Address
                            </label>
                        </div>
                    </div>
                    <!-- check box -->
                     <div class="formbottom">
                        <label for="" class="chek">
                            <input type="checkbox">&nbsp;Cash on Delivery
                        </label>
                     </div>

                     <!-- button -->
                      <div>
                        <button type="button" class="order" id="order">Order</button>
                      </div>

                 </form>

                </div>

             </div>

                 



        </section>

        <!-- Javascript link -->
         <script src="buy.js"></script>
    </body>
