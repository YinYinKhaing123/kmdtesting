<!DOCTYPE html>
<html>
    <head>
        <title>Computation Operation</title>
    </head>
    <body>
        <script>
            var num1=prompt("Enter First Number:");     //10
            var num2=prompt("Enter Second Number:");    //5
            var n1=parseInt(num1);
            var n2=parseInt(num2);
            document.write("n1="+n1+"<br>n2="+n2);
            document.write("<br>================================<br>");
            document.write("Add="+(n1+n2)+"<br>");
            document.write("Sub="+(n1-n2)+"<br>");
            document.write("Mul="+(n1*n2)+"<br>");
            document.write("Div="+(n1/n2)+"<br>");
            document.write("n1++="+(n1++)+"<br>");
            document.writeln("--n2="+(--n2)+"<br>");


        </script>
    </body>
</html>
